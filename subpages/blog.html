<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blog posts by Arne Persyn.">
  <title>Blog · Arne Persyn</title>
  <link href="../css/style.css" rel="stylesheet">
  <script src="../js/main.js" defer></script>
</head>

<body data-page="blog">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">Arne Persyn</a>
      <nav class="nav" aria-label="Main">
        <a href="../index.html" data-page="home">Home</a>
        <a href="about.html" data-page="about">About</a>
        <a href="projects.html" data-page="projects">Projects</a>
        <a href="blog.html" data-page="blog">Blog</a>
        <a href="cv.html" data-page="cv">CV</a>
        <a href="contact.html" data-page="contact">Contact</a>
      </nav>
      <div>
        <button class="icon-button theme-toggle" type="button" aria-label="Toggle theme">☾</button>
        <button class="icon-button nav-toggle" type="button" aria-label="Menu" aria-expanded="false">☰</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <h1>Blog</h1>
      <p class="page-intro">Notes on things I've built, learned and done.</p>

      <!-- Filter buttons: data-filter must match a word in a post's data-tags -->
      <div class="tags tag-filter">
        <button class="tag active" type="button" data-filter="all">All</button>
        <button class="tag" type="button" data-filter="personal">Personal</button>
        <button class="tag" type="button" data-filter="school">School</button>
        <button class="tag" type="button" data-filter="tech">Tech</button>
      </div>

      <!--
        To add a post:
        1. Copy blog/_template.html to blog/your-post-name.html and write it
        2. Add a <li class="card"> below (newest first)
        3. Optionally add it to "Latest posts" on index.html
      -->
      <ul class="card-list">
        <li class="card" data-tags="personal">
          <p class="meta"><time datetime="2026-10-15">15 October 2026</time> · Personal</p>
          <h3><a href="blog/welcome.html">Welcome to my blog</a></h3>
          <p>Why I started this site and what I'll be writing about.</p>
        </li>
      </ul>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span class="year">2026</span> Arne Persyn</p>
      <nav aria-label="Social">
        <a href="https://www.linkedin.com/in/arne-persyn-6748ba287/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>
</body>

</html>
