    <h1>Writing</h1>
    <p class="lede">Notes on things I've built, learned and done.</p>

    <!-- Filter: data-filter must match a word in a post's data-tags -->
    <p class="filter">
      Show:
      <button class="active" type="button" data-filter="all">everything</button> ·
      <button type="button" data-filter="personal">personal</button> ·
      <button type="button" data-filter="school">school</button> ·
      <button type="button" data-filter="tech">tech</button>
    </p>

    <!--
      To add a post:
      1. Copy blog/_template.html to blog/your-post-name.html and write it
      2. Add an <li> below (newest first) with the right data-tags
      3. Add it to "Recent writing" on index.html too
    -->
    <ul class="entries">
      <li data-tags="personal">
        <time class="when" datetime="2026-10-15">15 Oct 2026</time>
        <div>
          <a href="blog/welcome.html">Welcome to my blog</a>
          <p>Why I started this site and what I'll be writing about.</p>
        </div>
      </li>
    </ul>
